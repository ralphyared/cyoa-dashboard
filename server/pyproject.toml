[project]
name = "cyoa-server"
version = "0.1.0"
description = "Web dashboard backend for writing CYOA games"
requires-python = ">=3.12"
dependencies = [
    "cyoa",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
]

[project.scripts]
cyoa-server = "cyoa_server.__main__:main"

[tool.uv.sources]
cyoa = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyoa_server"]
