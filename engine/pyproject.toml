[project]
name = "cyoa"
version = "0.1.0"
description = "Engine and terminal player for choose-your-own-adventure games"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "rich>=13.7", "platformdirs>=4"]

[project.scripts]
cyoa-play = "cyoa.player.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyoa"]
