# Builds the standalone terminal player for Windows, macOS and Linux.
# Push a tag like `player-v1.0.0` to publish the executables as a GitHub release,
# or run it by hand from the Actions tab to just get the files as artifacts.
name: Player executables

on:
  push:
    tags: ["player-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: cyoa-play-linux-x64
          - os: windows-latest
            asset: cyoa-play-windows-x64.exe
          - os: macos-latest
            asset: cyoa-play-macos-arm64
          - os: macos-15-intel
            asset: cyoa-play-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Build
        shell: bash
        run: |
          uv venv
          uv pip install ./engine pyinstaller
          uv run --no-project pyinstaller --onefile --console --name cyoa-play \
            --collect-submodules rich._unicode_data engine/packaging/cyoa_play.py
          if [ "$RUNNER_OS" = "Windows" ]; then mv dist/cyoa-play.exe "dist/${{ matrix.asset }}"; \
          else mv dist/cyoa-play "dist/${{ matrix.asset }}"; fi
      - name: Smoke test
        shell: bash
        run: ./dist/${{ matrix.asset }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/player-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            Standalone terminal player for games made with the CYOA Dashboard.
            Put your game's `.cyoa.json` file next to the player and run it
            (or run `cyoa-play your_game.cyoa.json`).

            macOS: the first time, right-click the file and choose Open (it isn't signed).
            Windows: if SmartScreen warns you, choose "More info" then "Run anyway".
