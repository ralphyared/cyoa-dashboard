# Builds the standalone terminal player for Windows, macOS and Linux.
# Push a tag like `player-v1.0.0` to publish the executables as a GitHub release
# (the dashboard downloads them from there for "Ready-to-play game" exports), or
# run it by hand from the Actions tab to just get the files as artifacts.
name: Player executables

on:
  push:
    tags: ["player-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: cyoa-play-linux-x64
          - os: windows-latest
            asset: cyoa-play-windows-x64.exe
          - os: macos-latest
            asset: cyoa-play-macos-arm64
          - os: macos-15-intel
            asset: cyoa-play-macos-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./engine pyinstaller
          pyinstaller --onefile --console --name cyoa-play \
            --collect-submodules rich._unicode_data engine/packaging/cyoa_play.py
          if [ "$RUNNER_OS" = "Windows" ]; then mv dist/cyoa-play.exe "dist/${{ matrix.asset }}"
          else mv dist/cyoa-play "dist/${{ matrix.asset }}"; fi
      - name: Smoke test
        run: ./dist/${{ matrix.asset }} --version
      - name: Smoke test with a story attached
        # macOS exports ship the player unmodified (see server players.py), so
        # this step is informational there.
        continue-on-error: ${{ startsWith(matrix.os, 'macos') }}
        run: |
          python - <<'EOF'
          import json, pathlib
          from cyoa.standalone import attach
          game = {"format": 1, "id": "ci", "title": "CI", "start_scene": "a",
                  "scenes": [{"id": "a", "text": "Hello", "ending": {"kind": "victory"}}]}
          exe = pathlib.Path("dist/${{ matrix.asset }}")
          out = pathlib.Path("smoke" + exe.suffix)
          out.write_bytes(attach(exe.read_bytes(), json.dumps(game).encode()))
          out.chmod(0o755)
          EOF
          ./smoke* --check
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/player-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            Standalone terminal player for games made with the CYOA Dashboard.
            The dashboard uses these for "Export → Ready-to-play game"; you don't
            need to download them yourself.
